{% extends "base.html" %}

{% block title %}Create account{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-12 col-md-8 col-lg-5">
		<section class="auth-panel p-4 p-md-5 mx-auto">
			<div class="text-center mb-4">
				<span class="brand-mark mb-3"><i class="bi bi-person-plus-fill"></i></span>
				<h1 class="h3 fw-bold mb-2">Create your account</h1>
				<p class="text-secondary mb-0">Start sharing files with confidence.</p>
			</div>
			<form method="post" novalidate>
				<div class="mb-3">
					<label class="form-label fw-semibold" for="username">Username</label>
					<input class="form-control form-control-lg" type="text" id="username" name="username" autocomplete="username" required>
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold" for="password">Password</label>
					<input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
					<div class="form-text">Use at least 8 characters.</div>
				</div>
				<div class="mb-4">
					<label class="form-label fw-semibold" for="confirm_password">Confirm password</label>
					<input class="form-control form-control-lg" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
				</div>
				<button class="btn btn-primary btn-lg w-100" type="submit">Create account <i class="bi bi-arrow-right ms-1"></i></button>
			</form>
			<p class="text-center text-secondary mt-4 mb-0">Already have an account? <a class="text-teal fw-semibold text-decoration-none" href="{{ url_for('login') }}">Sign in</a></p>
		</section>
	</div>
</div>
{% endblock %}

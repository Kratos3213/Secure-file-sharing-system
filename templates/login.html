{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-12 col-md-8 col-lg-5">
		<section class="auth-panel p-4 p-md-5 mx-auto">
			<div class="text-center mb-4">
				<span class="brand-mark mb-3"><i class="bi bi-shield-lock-fill"></i></span>
				<h1 class="h3 fw-bold mb-2">Welcome back</h1>
				<p class="text-secondary mb-0">Sign in to access your protected files.</p>
			</div>
			<form method="post" novalidate>
				<div class="mb-3">
					<label class="form-label fw-semibold" for="username">Username</label>
					<input class="form-control form-control-lg" type="text" id="username" name="username" autocomplete="username" required>
				</div>
				<div class="mb-3">
					<div class="d-flex justify-content-between align-items-center">
						<label class="form-label fw-semibold" for="password">Password</label>
						<a class="small text-teal text-decoration-none" href="#">Forgot password?</a>
					</div>
					<input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
				</div>
				<div class="form-check mb-4">
					<input class="form-check-input" type="checkbox" id="remember" name="remember">
					<label class="form-check-label text-secondary" for="remember">Keep me signed in</label>
				</div>
				<button class="btn btn-primary btn-lg w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
			</form>
			<p class="text-center text-secondary mt-4 mb-0">New to VaultShare? <a class="text-teal fw-semibold text-decoration-none" href="{{ url_for('register') }}">Create an account</a></p>
		</section>
	</div>
</div>
{% endblock %}
